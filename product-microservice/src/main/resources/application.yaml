server:
  port: 8082

logging:
  level:
    com.example.order: DEBUG
    root: INFO
spring :
  application.name: product-microservice
  datasource:
    url: jdbc:h2:mem:productdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true                            # Enable H2 console
      path: /h2-console                        # Console path (accessible at: http://localhost:8081/h2-console)
